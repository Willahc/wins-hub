# WiNS Hub — config captar_doe multi-backend
# Sprint dia 4 (Sessao 1): 4 estados piloto.
#
# Backends:
#   - querido_diario: API OKBR (municipal)
#   - requests_html:  HTTP simples + trafilatura (estados sem anti-bot)
#   - playwright_pdf: Playwright + pdfplumber (estados SPA/PDF)

estados:
  - id: rj
    nome: "Rio de Janeiro - IOERJ"
    url: "https://www.ioerj.com.br"
    backend: playwright_pdf
    setor_uf_hint: "RJ"
    keywords:
      - "licença de instalação"
      - "licença prévia"
      - "autorização ambiental"
      - "outorga"
      - "concessão"
      - "investimento"
      - "R$ milhões"
      - "R$ bilhões"
      - "ordem de serviço"
      - "consórcio"
      - "EPC"
      - "obra"

  - id: mg
    nome: "Minas Gerais - Jornal MG"
    # 03/06: SPA Next.js — requests_html nao via links; trocado pra playwright_pdf
    url: "https://www.jornalminasgerais.mg.gov.br"
    backend: playwright_pdf
    setor_uf_hint: "MG"
    keywords:
      - "licença de instalação"
      - "licença prévia"
      - "outorga"
      - "concessão"
      - "investimento"
      - "R$ milhões"
      - "R$ bilhões"
      - "Cemig"
      - "Copasa"
      - "MGI"
      - "obra"

  - id: rs
    nome: "Rio Grande do Sul - DOERS"
    # URL alternativa: corag.rs.gov.br DNS nao resolve do container; usar dorgs
    url: "https://www.diariooficial.rs.gov.br"
    backend: requests_html
    setor_uf_hint: "RS"
    keywords:
      - "licença de instalação"
      - "licença prévia"
      - "outorga"
      - "concessão"
      - "investimento"
      - "R$ milhões"
      - "R$ bilhões"
      - "CEEE"
      - "Corsan"
      - "Sulgás"
      - "obra"

  - id: pr
    nome: "Paraná - AEN (notícias governo)"
    url: "https://www.aen.pr.gov.br"
    backend: requests_html
    setor_uf_hint: "PR"
    keywords:
      - "obra"
      - "investimento"
      - "R$ milhões"
      - "R$ bilhões"
      - "licença"
      - "concessão"
      - "Copel"
      - "Sanepar"
      - "ordem de serviço"
      - "EPC"

  # === 03/06: Tier A novos — PA, MS, GO ===
  - id: pa
    nome: "Para - IOEPA (URL template direto)"
    # URL com placeholders: {yyyy} {mm} {dd} — backend monta pra cada dia da janela
    url: "http://www.ioepa.com.br/arquivos/{yyyy}/{yyyy}.{mm}.{dd}.DOE.pdf"
    backend: direct_pdf
    setor_uf_hint: "PA"
    keywords:
      - "Vale"
      - "MRN"
      - "Alunorte"
      - "Albras"
      - "obra"
      - "investimento"
      - "R$ milhões"
      - "R$ bilhões"
      - "licença"
      - "outorga"
      - "concessão"
      - "Porto"
      - "Belo Monte"
      - "Hydro"

  - id: ms
    nome: "Mato Grosso do Sul - DOE"
    # Landing page lista PDFs do dia — requests_html acha os href .pdf
    url: "https://www.diariooficial.ms.gov.br/"
    backend: requests_html
    setor_uf_hint: "MS"
    keywords:
      - "Diário Oficial"
      - "diario oficial"
      - "Suplemento"
      - "edição"
      - "edicao"
      - "DOE"
      - "obra"
      - "investimento"

  - id: go
    nome: "Goias - Diario Oficial"
    # casacivil tem link pra diariooficial.abc.go.gov.br
    url: "http://diariooficial.abc.go.gov.br/"
    backend: requests_html
    setor_uf_hint: "GO"
    keywords:
      - "Diário Oficial"
      - "diario oficial"
      - "edição"
      - "edicao"
      - "obra"
      - "investimento"
      - "R$ milhões"
      - "R$ bilhões"
      - "licença"
      - "concessão"

# Legacy (sprint dia 3) — usado se chamado sem --uf
state_codes: "RJ,RS,BA"
territory_ids: []
