# YAML captador notícias setoriais — atualizado 12/05/2026 (sessão descoberta + análise vocabulário)
# Fontes triadas via descobrir_fontes_noticias.py + análise Haiku via analisar_keywords.py
#
# Estrutura:
#   fontes_tier_1: alta cobertura industrial OU alta confiança setorial
#   fontes_tier_2: cobertura moderada / nicho
#   keywords_globais: pre-filter ANTES de Haiku (economia de tokens)
#   keywords_por_tipo_obra: extraídas via análise Haiku, pra futura especialização do prompt

fontes_tier_1:
  - nome: agenciainfra
    rss: https://agenciainfra.com/blog/feed/
    # Score 1456 (91 items/7d × cobertura 16). Especialista em infraestrutura.
  - nome: braziljournal
    rss: https://braziljournal.com/feed/
    # Cobertura 11. Negócios + investimentos privados.
  - nome: exame
    rss: https://exame.com/feed/
    # 25 items/7d, cobertura 6. Generalista forte.
  - nome: neofeed
    rss: https://neofeed.com.br/feed/
    # Cobertura 7. Empresas + tecnologia.
  - nome: epbr
    rss: https://eixos.com.br/feed/
    # RSS redireciona pra eixos.com.br (rede epbr). Energia/petróleo. 20 items/7d.

fontes_tier_2:
  - nome: istoedinheiro
    rss: https://istoedinheiro.com.br/rss/
    # 100 items/7d, cobertura 5. Alto volume, sinal/ruído moderado.
  - nome: moneytimes
    rss: https://www.moneytimes.com.br/feed/
    # 10 items/7d, cobertura 4. Mercado + investimentos.
  - nome: panoramafarmaceutico
    rss: https://panoramafarmaceutico.com.br/feed/
    # Nicho farmacêutico (fábricas CAPEX alto).
  - nome: g1_economia
    tipo: sitemap
    rss: https://g1.globo.com/sitemap/g1/sitemap.xml
    path_filter:
      - /economia/agronegocios/
      - /economia/industria/
      - /economia/empresas/
      - /economia/infraestrutura/
    max_entries: 30
    horas_lookback: 24
    # G1 não tem RSS funcional; sitemap diário + scraping og:description.

# Mantém o nome `fontes` por compatibilidade com script atual.
# `fontes` = tier_1 + tier_2 (script processa em ordem).
  - nome: click_petroleo
    tipo: rss_flaresolverr
    rss: https://clickpetroleoegas.com.br/feed/
    # CF Turnstile bloqueia feedparser direto; resolvido via FlareSolverr.

fontes:
  - nome: agenciainfra
    rss: https://agenciainfra.com/blog/feed/
  - nome: braziljournal
    rss: https://braziljournal.com/feed/
  - nome: exame
    rss: https://exame.com/feed/
  - nome: neofeed
    rss: https://neofeed.com.br/feed/
  - nome: epbr
    rss: https://eixos.com.br/feed/
  - nome: istoedinheiro
    rss: https://istoedinheiro.com.br/rss/
  - nome: moneytimes
    rss: https://www.moneytimes.com.br/feed/
  - nome: panoramafarmaceutico
    rss: https://panoramafarmaceutico.com.br/feed/
  - nome: g1_economia
    tipo: sitemap
    rss: https://g1.globo.com/sitemap/g1/sitemap.xml
    path_filter:
      - /economia/agronegocios/
      - /economia/industria/
      - /economia/empresas/
      - /economia/infraestrutura/
    max_entries: 30
    horas_lookback: 24
  - nome: click_petroleo
    tipo: rss_flaresolverr
    rss: https://clickpetroleoegas.com.br/feed/

  # Sprint dia 6 (Sessão 3): 4 fontes setoriais novas (RSS direto validado).
  # aecweb e noticiasdemineracao testados mas sem RSS válido — não incluídos.
  - nome: obras_construcao_civil
    rss: https://obrasconstrucaocivil.com/feed/
    # 40 entries no smoke. Setor INFRAESTRUTURA/INDUSTRIAL.
  - nome: defesanet
    rss: https://www.defesanet.com.br/feed
    # 10 entries no smoke. Setor DEFESA.
  - nome: tecnodefesa
    rss: https://www.tecnodefesa.com.br/feed
    # 10 entries no smoke. Setor DEFESA.
  - nome: monitormercantil
    rss: https://monitormercantil.com.br/feed/
    # 12 entries no smoke. Setor CROSS — economia/mercado.

  # V9 backlog (14/05/2026) — 4 fontes adicionadas pra monitorar empresas
  # validadas no chat (Schomäcker/Agrária/Atvos/Mahindra). Outras 3 do briefing
  # (Galvanotek/NewWave/Multilog) sem RSS viável — ver comentário abaixo.
  - nome: ndmais
    rss: https://ndmais.com.br/feed/
    # Full-feed Santa Catarina (20 items/run). Cobre Schomäcker em Joinville.
  - nome: canalrural
    rss: https://www.canalrural.com.br/feed/
    # Full-feed agro nacional (10 items/run). Cobre Agrária Guarapuava.
