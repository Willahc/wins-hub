    # Search-feed WordPress (4 items). Foco Mahindra.

# Fora desta lista (decisão 12/05/2026 + dia 6):
#   - valor: cobertura industrial baixa (2)
#   - clickpetroleoegas: Cloudflare bloqueia; fase 2 com Playwright fallback
#   - infomoney, broadcast: cobertura zero ou 1
#   - g1_economia: RSS não encontrado
#   - portalmineracao: DNS quebrado
#   - aecweb: sem RSS válido (404 em /feed e /revista/feed). Testar sitemap dia 7+.
#   - noticiasdemineracao: feedparser retorna bozo=1, 0 entries. Investigar dia 7+.
#   - galpaodasmaquinas.com.br (Galvanotek RS): /feed/ 404; sem RSS. Considerar HTML scraper dia 7+.
#   - brasilmineral.com.br (New Wave PA): /feed/ 403 Cloudflare; FlareSolverr resolve mas devolve HTML não-RSS.
#   - tecnologistica.com.br (Multilog SC): /feed/ 404; /rss/ 403. Sem caminho viável.

# Keywords globais — usadas no pre-filter ANTES de chamar Haiku (economia de tokens).
# Match insensitive; '*' vira regex .*
keywords_globais:
  # Genéricas (vão pegar muito ruído mas Haiku filtra depois)
  - "R$ * bilh"
  - "R$ * milh"
  - investimento
  - anuncia
  # Construção / fábrica
  - nova fábrica
  - nova planta
  - nova unidade
  - vai construir
  - construir uma nova
  - construção de
  - expansão
  - capacidade de produção
  - novo ciclo de investimentos
  # Operação
  - começará a operar
  - inauguração
  - planta industrial
  # Setoriais
  - data center
  - reator
  - subestação
  - mineração
  - terras raras
  - usina
  # Infra/PPP
  - lançamento de edital
  - ppp
  - parceria público-privada
  - licença de instalação
  - dnit
  - concessionárias
  - construção de pontes
  - aterros sanitários

# Compatibilidade com script captar_noticias_setoriais.py (lê keywords_capex).
