# Keywords descobertas via análise Haiku do corpus (74 textos, 17 obras reais identificadas).
# Pode ser usado em refactor futuro pra especializar o prompt Haiku por tipo_obra.
keywords_por_tipo_obra:
  fabrica:
    - nova fábrica
    - construir uma nova
    - nova planta
    - capacidade de produção
    - novo ciclo de investimentos
    - investimentos para produção
    - aumentar sua capacidade

  infraestrutura:
    - concessionárias de rodovias
    - lançamento de edital
    - ppp
    - parceria público-privada
    - licença de instalação
    - dnit autorização
    - construção de pontes
    - unidades básicas de saúde
    - aterros sanitários
    - br-* (rodovia federal)
    - construção e operação

  energia:
    - investimento de R$
    - reator de alta tensão
    - renovação de concessões
    - distribuição de energia
    - exploração e produção de óleo e gás
    - assinaram contratos com ministério de minas e energia
    - subestação
    - estabilizar a rede
    - ampliar reservas

  mineracao:
    - exploração de terras raras
    - marco legal
    - investir R$
    - acordo de parceria
    - mineração
