<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiNS HUB — Recuperar senha</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        :root {
            --bg-base:#0a0e1a;--bg-panel:#0f1525;--bg-input:#141b2e;
            --border:#1f2942;--text:#e8ecf4;--text-dim:#6b7693;
            --accent:#f5b800;--accent-hi:#ffd24d;--success:#4ade80;--error:#f87171;
        }
        *{box-sizing:border-box;margin:0;padding:0}
        html,body{height:100%;background:var(--bg-base);color:var(--text);
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
            -webkit-font-smoothing:antialiased}
        body{display:flex;align-items:center;justify-content:center;padding:24px;
            background:radial-gradient(circle at 20% 10%,rgba(245,184,0,.06),transparent 40%),
                       radial-gradient(circle at 80% 90%,rgba(245,184,0,.04),transparent 40%),
                       var(--bg-base)}
        .card{width:100%;max-width:420px;background:var(--bg-panel);
            border:1px solid var(--border);border-radius:12px;padding:40px 36px;
            box-shadow:0 20px 60px rgba(0,0,0,.4)}
        .brand{display:flex;align-items:baseline;gap:10px;margin-bottom:6px;flex-wrap:wrap}
        .brand h1{font-size:28px;font-weight:800;letter-spacing:1.5px;color:var(--accent)}
        .brand .subtitle{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1.2px}
        h2{font-size:18px;font-weight:600;margin:28px 0 12px}
        .desc{font-size:13px;color:var(--text-dim);margin-bottom:24px;line-height:1.5}
        .field{margin-bottom:16px}
        .field label{display:block;font-size:11px;text-transform:uppercase;
            letter-spacing:.8px;color:var(--text-dim);margin-bottom:6px}
        .field input{width:100%;background:var(--bg-input);border:1px solid var(--border);
            color:var(--text);padding:11px 14px;border-radius:6px;font-size:14px;
            font-family:inherit;transition:border-color .15s,background .15s}
        .field input:focus{outline:none;border-color:var(--accent);background:#161e35}
        .field input::placeholder{color:#4a5573}
        button.primary{width:100%;background:var(--accent);color:#0a0e1a;border:none;
            padding:12px;border-radius:6px;font-size:14px;font-weight:700;letter-spacing:.5px;
            cursor:pointer;margin-top:8px;transition:background .15s}
        button.primary:hover:not(:disabled){background:var(--accent-hi)}
        button.primary:disabled{opacity:.5;cursor:not-allowed}
        .toggle{text-align:center;margin-top:20px;font-size:13px;color:var(--text-dim)}
        .toggle a{color:var(--accent);text-decoration:none;cursor:pointer;
            font-weight:600;margin-left:4px}
        .toggle a:hover{text-decoration:underline}
        .alert{padding:10px 12px;border-radius:6px;font-size:13px;margin-bottom:16px;border:1px solid}
        .alert.error{background:rgba(248,113,113,.08);border-color:rgba(248,113,113,.3);color:var(--error)}
        .alert.success{background:rgba(74,222,128,.08);border-color:rgba(74,222,128,.3);color:var(--success);line-height:1.5}
        .footer{margin-top:28px;padding-top:20px;border-top:1px solid var(--border);
            font-size:11px;color:var(--text-dim);text-align:center;letter-spacing:.3px}
        [x-cloak]{display:none !important}
    </style>
</head>
<body>

<div class="card" x-data="esqueciForm()" x-cloak>
    <div class="brand"><a href="/login" class="wnshub-logo-link" style="text-decoration:none;color:inherit;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;">
        <h1>WiNS HUB</h1>
        <span class="subtitle">Inteligencia Comercial</span>
    </a></div>

    <h2>Recuperar senha</h2>
    <div class="desc">Informe o email cadastrado e enviaremos um link para voce criar uma nova senha.</div>

    <template x-if="error">
        <div class="alert error" x-text="error"></div>
    </template>
    <template x-if="enviado">
        <div class="alert success">
            Se este email estiver cadastrado, voce recebera um link em alguns instantes.<br>
            Verifique tambem a pasta de spam.
        </div>
    </template>

    <form @submit.prevent="submit()" x-show="!enviado">
        <div class="field">
            <label for="email">E-mail</label>
            <input id="email" type="email" x-model="form.email" required
                   placeholder="voce@empresa.com.br" autocomplete="email">
        </div>

        <button type="submit" class="primary" :disabled="loading"
                x-text="loading ? 'Enviando...' : 'Enviar link de recuperacao'"></button>
    </form>

    <div class="toggle">
        <span>Lembrou a senha?<a href="/login">Voltar ao login</a></span>
    </div>

    <div class="footer">WiNS HUB &middot; Acesso restrito</div>
</div>

<script>
function esqueciForm(){
    return {
        loading:false,
        error:'',
        enviado:false,
        form:{email:''},
        async submit(){
            this.error='';
            this.loading=true;
            try{
                const res = await fetch('/api/auth/esqueci',{
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({email:this.form.email})
                });
                if(!res.ok){
                    const d = await res.json().catch(()=>({}));
                    this.error = d.detail || 'Erro ao processar requisicao.';
                    return;
                }
                this.enviado = true;
            }catch(e){
                this.error = 'Falha de conexao. Tente novamente.';
            }finally{
                this.loading = false;
            }
        }
    };
}
</script>

</body>
</html>
