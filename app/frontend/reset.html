<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="twitter:image" content="https://winshubcomercial.com.br/static/og-card.png">

  <!-- SEO -->
  <meta name="description" content="Mais de 5 mil obras com decisor mapeado. Decisor verificado, pronto para o contato.">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        :root {
            --bg-base:#0a0e1a;--bg-panel:#0f1525;--bg-input:#141b2e;
            --border:#1f2942;--text:#e8ecf4;--text-dim:#6b7693;
            --accent:#f5b800;--accent-hi:#ffd24d;--success:#4ade80;--error:#f87171;
        }
        *{box-sizing:border-box;margin:0;padding:0}
        html,body{height:100%;background:var(--bg-base);color:var(--text);
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
            -webkit-font-smoothing:antialiased}
        body{display:flex;align-items:center;justify-content:center;padding:24px;
            background:radial-gradient(circle at 20% 10%,rgba(245,184,0,.06),transparent 40%),
                       radial-gradient(circle at 80% 90%,rgba(245,184,0,.04),transparent 40%),
                       var(--bg-base)}
        .card{width:100%;max-width:420px;background:var(--bg-panel);
            border:1px solid var(--border);border-radius:12px;padding:40px 36px;
            box-shadow:0 20px 60px rgba(0,0,0,.4)}
        .brand{display:flex;align-items:baseline;gap:10px;margin-bottom:6px;flex-wrap:wrap}
        .brand h1{font-size:28px;font-weight:800;letter-spacing:1.5px;color:var(--accent)}
        .brand .subtitle{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1.2px}
        h2{font-size:18px;font-weight:600;margin:28px 0 12px}
        .desc{font-size:13px;color:var(--text-dim);margin-bottom:24px;line-height:1.5}
        .field{margin-bottom:16px}
        .field label{display:block;font-size:11px;text-transform:uppercase;
            letter-spacing:.8px;color:var(--text-dim);margin-bottom:6px}
        .field input{width:100%;background:var(--bg-input);border:1px solid var(--border);
            color:var(--text);padding:11px 14px;border-radius:6px;font-size:14px;
            font-family:inherit;transition:border-color .15s,background .15s}
        .field input:focus{outline:none;border-color:var(--accent);background:#161e35}
        .field input::placeholder{color:#4a5573}
        .field input:disabled{opacity:.6}
        .hint{font-size:11px;color:var(--text-dim);margin-top:4px}
        button.primary{width:100%;background:var(--accent);color:#0a0e1a;border:none;
            padding:12px;border-radius:6px;font-size:14px;font-weight:700;letter-spacing:.5px;
            cursor:pointer;margin-top:8px;transition:background .15s}
        button.primary:hover:not(:disabled){background:var(--accent-hi)}
        button.primary:disabled{opacity:.5;cursor:not-allowed}
        .toggle{text-align:center;margin-top:20px;font-size:13px;color:var(--text-dim)}
        .toggle a{color:var(--accent);text-decoration:none;cursor:pointer;
            font-weight:600;margin-left:4px}
        .toggle a:hover{text-decoration:underline}
        .alert{padding:10px 12px;border-radius:6px;font-size:13px;margin-bottom:16px;
            border:1px solid;line-height:1.5}
        .alert.error{background:rgba(248,113,113,.08);border-color:rgba(248,113,113,.3);color:var(--error)}
        .alert.success{background:rgba(74,222,128,.08);border-color:rgba(74,222,128,.3);color:var(--success)}
        .footer{margin-top:28px;padding-top:20px;border-top:1px solid var(--border);
            font-size:11px;color:var(--text-dim);text-align:center;letter-spacing:.3px}
        [x-cloak]{display:none !important}
    </style>
</head>
<body>

<div class="card" x-data="resetForm()" x-cloak x-init="init()">
    <div class="brand"><a href="/login" class="wnshub-logo-link" style="text-decoration:none;color:inherit;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;">
        <h1>WiNS HUB</h1>
        <span class="subtitle">Inteligencia Comercial</span>
    </a></div>

    <h2>Definir nova senha</h2>

    <template x-if="state === 'loading'">
        <div class="desc">Validando link...</div>
    </template>

    <template x-if="state === 'invalid'">
        <div>
            <div class="alert error" x-text="error"></div>
            <a href="/esqueci" style="display:block;text-align:center;margin-top:12px;color:var(--accent);text-decoration:none;font-weight:600;font-size:13px;">
                Solicitar novo link
            </a>
        </div>
    </template>

    <template x-if="state === 'sucesso'">
        <div>
            <div class="alert success">
                Senha alterada com sucesso!<br>Voce sera redirecionado ao login...
            </div>
        </div>
    </template>

    <template x-if="state === 'pronto'">
        <div>
            <div class="desc">Voce esta redefinindo a senha de <strong x-text="email" style="color:var(--text)"></strong></div>

            <template x-if="error">
                <div class="alert error" x-text="error"></div>
            </template>

            <form @submit.prevent="submit()">
                <div class="field">
                    <label for="senha">Nova senha</label>
                    <input id="senha" type="password" x-model="form.senha" required
                           placeholder="Minimo 6 caracteres" autocomplete="new-password">
                    <div class="hint">Use no minimo 6 caracteres.</div>
                </div>

                <div class="field">
                    <label for="senha2">Confirmar senha</label>
                    <input id="senha2" type="password" x-model="form.senha2" required
                           placeholder="Repita a senha" autocomplete="new-password">
                </div>

                <button type="submit" class="primary" :disabled="loading"
                        x-text="loading ? 'Salvando...' : 'Definir nova senha'"></button>
            </form>
        </div>
    </template>

    <div class="toggle">
        <span><a href="/login">Voltar ao login</a></span>
    </div>

    <div class="footer">WiNS HUB &middot; Acesso restrito</div>
</div>

<script>
function resetForm(){
    return {
        state:'loading',
        token:'',
        email:'',
        loading:false,
        error:'',
        form:{senha:'',senha2:''},
        async init(){
            const params = new URLSearchParams(window.location.search);
            this.token = params.get('token') || '';
            if(!this.token){
                this.state = 'invalid';
                this.error = 'Link invalido. Solicite um novo.';
                return;
            }
            try{
                const res = await fetch('/api/auth/reset/' + encodeURIComponent(this.token));
                const d = await res.json().catch(()=>({}));
                if(!res.ok){
                    this.state = 'invalid';
                    this.error = d.detail || 'Link invalido ou expirado.';
                    return;
                }
                this.email = d.email || '';
                this.state = 'pronto';
            }catch(e){
                this.state = 'invalid';
                this.error = 'Falha de conexao. Tente novamente.';
            }
        },
        async submit(){
            this.error = '';
            if(this.form.senha.length < 6){
                this.error = 'Senha precisa ter pelo menos 6 caracteres.';
                return;
            }
            if(this.form.senha !== this.form.senha2){
                this.error = 'As senhas nao coincidem.';
                return;
            }
            this.loading = true;
            try{
                const res = await fetch('/api/auth/reset',{
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({token:this.token,senha:this.form.senha})
                });
                const d = await res.json().catch(()=>({}));
                if(!res.ok){
                    this.error = d.detail || 'Erro ao redefinir senha.';
                    return;
                }
                this.state = 'sucesso';
                setTimeout(()=>{window.location.href='/login';}, 2500);
            }catch(e){
                this.error = 'Falha de conexao. Tente novamente.';
            }finally{
                this.loading = false;
            }
        }
    };
}
</script>

</body>
</html>
