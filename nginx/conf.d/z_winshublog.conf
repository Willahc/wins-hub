# WiNS Hub Log — log.winshubcomercial.com.br
# NÃO é default_server. NÃO altera wins_hub.conf (Comercial).
# Proxy: Gunicorn host via docker gateway 172.18.0.1:5056

upstream wins_hub_log_upstream {
    server 172.18.0.1:5056;
    keepalive 8;
}

# HTTP → HTTPS (ACME challenge permanece acessível)
server {
    listen 80;
    listen [::]:80;
    server_name log.winshubcomercial.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — WiNS Hub Log
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name log.winshubcomercial.com.br;

    ssl_certificate     /etc/letsencrypt/live/log.winshubcomercial.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/log.winshubcomercial.com.br/privkey.pem;

    # Alinhado ao perfil do Comercial (Mozilla Intermediate-ish)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL_LOG:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    client_max_body_size 50M;
    server_tokens off;

    location / {
        proxy_pass http://wins_hub_log_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }
}
