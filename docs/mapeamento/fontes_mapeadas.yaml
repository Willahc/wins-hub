  - id: dou
    nome: DOU — Diario Oficial da Uniao via InLabs (Imprensa Nacional)
    url: https://inlabs.in.gov.br/
    tipo_tecnico: rest_api  # /logar.php + /index.php?p=YYYY-MM-DD (zip de XMLs)
    freq_publicacao: diaria
    antecipacao_semanas: 0-4
    volume_estimado_mes: 50  # apos filtros keyword
    custo_implementacao: ja_feito  # 2026-05-13 dia 2 sprint
    custo_operacional: haiku  # ~$0.50-2.00 por edicao diaria
    status_wins: coberto
    api_publica: true
    cadastro_requerido: true  # InLabs cadastro gratuito
    anti_bot: false
    scrapeable: true
    scraper_oss: nao
    notas: |
      [COBERTO 2026-05-13] captar_dou_inlabs.py:
        - Login: POST /logar.php (form-data email/password)
        - Edicao: GET /index.php?p=YYYY-MM-DD lista ZIPs por secao
        - Foco: DO3 (avisos de licitacao) + DO1 (atos executivos)
        - Filtro: regex keywords (obra, investimento, R$ X milhoes/bilhoes,
          ordem de inicio, EPC, licenca ambiental, contratacao engenharia)
        - Haiku 4.5 extrai JSON estruturado
        - INSERT obras fonte='dou' fonte_tipo='OFICIAL'
        - Idempotente via id_externo = "DOU:<identifica>"
      Credenciais: INLABS_USER + INLABS_PASS no .env.

